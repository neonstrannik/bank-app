name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
        # не указываем cache-dependency-path
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
        # не указываем cache-dependency-path
      
      - name: Build Backend
        working-directory: ./backend
        run: |
          go mod download
          go build -v ./...
      
      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
      
      - name: Build Docker images
        run: |
          docker build -t bank-backend:test ./backend
          docker build -t bank-frontend:test ./frontend